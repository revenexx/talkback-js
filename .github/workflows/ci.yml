name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (biome · tsc · vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changeset status compares against origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: biome · tsc · vitest
        run: npm run check

      # Explicit, in addition to prepublishOnly: a sibling package once shipped an empty
      # tarball because nothing built before the publish.
      - run: npm run build

      # Two exemptions, both about branches that cannot reasonably carry a changeset.
      #
      # `changeset-release/main` is the branch the release workflow opens; its whole
      # purpose is to CONSUME the changesets, so it has none left by definition.
      #
      # `dependabot/*` is every dependency bump. Each one touches package.json and
      # package-lock.json, so without this the gate fires on all of them — and a
      # devDependency reaches no consumer, since `files` is ["dist", "LICENSE"]. The
      # exemption is keyed to the BRANCH rather than `github.actor` on purpose: a human
      # pushing a fix onto a Dependabot branch flips `actor` to that human, and the gate
      # would start firing for a reason nobody would connect to the push.
      #
      # It follows that a bump touching peerDependencies needs a changeset written by
      # hand. Peers are part of the package's promise; devDependencies are not.
      - if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && !startsWith(github.head_ref, 'dependabot/')
        name: This PR carries a changeset
        run: |
          git fetch origin main:refs/remotes/origin/main
          npx changeset status --since=origin/main
