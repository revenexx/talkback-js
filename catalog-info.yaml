apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: talkback-js
  title: Talkback JS
  description: "The client half of the Talkback contract — the channel grammar, a facade client, a BFF token route factory, an Echo-shaped browser client and Vue composables."
  annotations:
    github.com/project-slug: revenexx/talkback-js
  tags:
    - typescript
    - realtime
    - centrifugo
    - websocket
    - vue
  links:
    - url: https://www.npmjs.com/package/@revenexx/talkback-js
      title: npm
      icon: code
spec:
  type: library
  # The client half of ADR-0093, and `platform-team` is what the service half
  # (component:default/talkback) names — the two are one contract and should not
  # show two owners. Note the org spells this team both ways; `platform` and
  # `platform-team` are separate Groups in the backstage org.yaml and both resolve.
  owner: group:default/platform-team
  system: revenue-cloud
  lifecycle: production
